name: Benchmark e Atualização do Relatório

on:
  workflow_dispatch:
    inputs:
      algorithms:
        description: 'Algoritmos requeridos (1=2f Fitas, 2=f+1 Fitas, 3=Quicksort Externo, ou "all", ex: "1,2")'
        required: true
        default: 'all'
        type: string
      situations:
        description: 'Tipos de entrada (1=Ascendente, 2=Descendente, 3=Desordenado, ou "all", ex: "1,3")'
        required: true
        default: 'all'
        type: string
      quantities:
        description: 'Quantidades de registros separadas por vírgula'
        required: true
        default: '100,200,2000,20000,200000,471705'
        type: string
      runs:
        description: 'Número de execuções por configuração (para cálculo de p50, p75, p99)'
        required: true
        default: '5'
        type: string
      timeout_seconds:
        description: 'Tempo máximo (timeout) em segundos por execução do programa'
        required: true
        default: '60'
        type: string
      build_type:
        description: 'Perfil de compilação CMake'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      commit_results:
        description: 'Fazer commit do CSV e do relatório atualizado no repositório'
        required: false
        default: false
        type: boolean

jobs:
  benchmark-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências de compilação e LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            texlive-lang-portuguese

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compilar projeto C++ (ordena)
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}
          cmake --build build --parallel

      - name: Gerar arquivos de entrada (tmp/)
        run: |
          python3 scripts/generate_provao.py --input PROVAO.TXT --output-dir tmp

      - name: Executar benchmarks e gerar CSV
        run: |
          python3 scripts/run_benchmarks.py \
            --binary ./build/ordena \
            --algorithms "${{ inputs.algorithms }}" \
            --situations "${{ inputs.situations }}" \
            --quantities "${{ inputs.quantities }}" \
            --runs "${{ inputs.runs }}" \
            --timeout "${{ inputs.timeout_seconds }}" \
            --output-csv results/benchmark.csv \
            --fail-on-error

      - name: Atualizar tabelas do relatório LaTeX
        run: |
          python3 scripts/update_report.py \
            --csv results/benchmark.csv \
            --tex relatorio.tex

      - name: Compilar relatório (relatorio.pdf)
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error relatorio.tex
          pdflatex -interaction=nonstopmode -halt-on-error relatorio.tex

      - name: Publicar artefatos (CSV e Relatório)
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-e-relatorio
          path: |
            results/benchmark.csv
            relatorio.tex
            relatorio.pdf

      - name: Commit e push dos resultados (opcional)
        if: ${{ inputs.commit_results }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/benchmark.csv relatorio.tex relatorio.pdf
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "chore: update benchmark csv and compiled report"
            git push
          fi
